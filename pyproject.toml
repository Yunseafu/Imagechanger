[project]
name = "imagechanger"
version = "0.1.0"
description = "Add Photographic Styles (palette) data to HEIC photos from older iPhones"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pillow", "pillow-heif"]

[project.scripts]
imagechanger = "imagechanger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imagechanger"]
